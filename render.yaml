# render.yaml - Versão Corrigida

# Define os serviços da aplicação
services:
  # 1. Serviço do Banco de Dados PostgreSQL
  - name: flashify-db
    type: pserv
    # Adicionado ipAllowList para permitir conexões de dentro da sua conta Render
    ipAllowList: [] 

  # 2. Serviço do Redis
  - name: flashify-redis
    type: redis

  # 3. Serviço do Backend (API FastAPI)
  - name: flashify-backend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app # <-- IMPORTANTE: ALTERE AQUI!
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: flashify-db
          # CORREÇÃO: Usar 'internalConnectionString' para a comunicação interna
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flashify-redis
          # CORREÇÃO: Usar 'internalConnectionString' para a comunicação interna
          property: internalConnectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # 4. Serviço do Worker (Celery)
  - name: flashify-worker
    type: worker
    env: docker
    repo: https://github.com/g-f307/flashify-app # <-- IMPORTANTE: ALTERE AQUI!
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    # CORREÇÃO: A propriedade para o comando do Docker é 'dockerCommand'
    dockerCommand: "celery -A app.worker worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: flashify-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flashify-redis
          property: internalConnectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: flashify-backend
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256

  # 5. Serviço do Frontend (Next.js)
  - name: flashify-frontend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app # <-- IMPORTANTE: ALTERE AQUI!
    dockerContext: ./front
    dockerfilePath: ./front/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: flashify-backend
          # CORREÇÃO: A propriedade correta para a URL pública é 'url' (a sua estava certa,
          # mas o erro anterior provavelmente causou uma falha em cascata)
          property: url