# render.yaml - Versão Final com Planos Gratuitos Explícitos

databases:
  - name: flashify-db
    plan: free

services:
  # Serviço do Redis
  - name: flashify-redis
    type: redis
    plan: free # <-- ADICIONADO: Define o plano gratuito para o Redis
    ipAllowList: []

  # Backend (FastAPI)
  - name: flashify-backend
    type: web
    plan: free # <-- ADICIONADO: Define o plano gratuito para o serviço web
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # Worker (Celery)
  - name: flashify-worker
    type: worker
    plan: free # <-- ADICIONADO: Define o plano gratuito para o worker
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    dockerCommand: "celery -A app.worker worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: flashify-backend
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256

  # Frontend (Next.js)
  - name: flashify-frontend
    type: web
    plan: free # <-- ADICIONADO: Define o plano gratuito para o serviço web
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./front
    dockerfilePath: ./front/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://temp-url-will-be-replaced.com