# render.yaml - Versão Corrigida Final

databases:
  - name: flashify-db
    plan: free

services:
  # 1. Serviço do Redis
  - name: flashify-redis
    type: redis
    ipAllowList: []

  # 2. Serviço do Backend (API FastAPI)
  - name: flashify-backend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app # <-- ajuste se for fork
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromService:
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # 3. Serviço do Worker (Celery)
  - name: flashify-worker
    type: worker
    env: docker
    repo: https://github.com/g-f307/flashify-app
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    dockerCommand: "celery -A app.worker worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromService:
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          name: flashify-backend
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256

  # 4. Serviço do Frontend (Next.js)
  - name: flashify-frontend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app
    dockerContext: ./front
    dockerfilePath: ./front/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: flashify-backend
          property: url
