# render.yaml - Versão Corrigida com Referências Corretas

# Primeiro, definimos os serviços de base de dados.
databases:
  - name: flashify-db
    plan: free # 'free' é uma boa opção para começar.

# Em seguida, definimos os serviços da aplicação.
services:
  # 1. Serviço do Redis
  - name: flashify-redis
    type: redis
    plan: free
    ipAllowList: [] # Necessário para permitir o acesso de outros serviços seus.

  # 2. Backend (FastAPI)
  - name: flashify-backend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: # <-- CORREÇÃO: Usar 'fromDatabase' para o PostgreSQL
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService: # <-- 'fromService' está correto aqui, pois Redis foi definido como um serviço
          type: redis # Adicionar o tipo para ser mais explícito
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # 3. Worker (Celery)
  - name: flashify-worker
    type: worker
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    dockerCommand: "celery -A app.worker worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase: # <-- CORREÇÃO: Usar 'fromDatabase' para o PostgreSQL
          name: flashify-db
          property: connectionString
      - key: REDIS_URL
        fromService: # <-- 'fromService' está correto aqui
          type: redis
          name: flashify-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService: # <-- 'fromService' está correto para referenciar outro serviço
          type: web
          name: flashify-backend
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256

  # 4. Frontend (Next.js)
  - name: flashify-frontend
    type: web
    env: docker
    repo: https://github.com/g-f307/flashify-app
    branch: dev
    dockerContext: ./front
    dockerfilePath: ./front/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: # <-- 'fromService' está correto aqui
          type: web
          name: flashify-backend
          property: url